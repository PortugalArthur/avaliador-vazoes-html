name: Distribuição portátil para Windows

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/distribuir-windows.yml
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: distribuicao-portatil-windows

jobs:
  distribuir:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Preparar e verificar a distribuição
        run: python -m infraestrutura.empacotar_portatil --destino dist
      - name: Publicar ZIP e SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $linha = Select-String -Path aplicacao/executar.py -Pattern "^VERSAO='(\d+\.\d+\.\d+)'$"
          if (-not $linha) { throw 'Versão do avaliador inválida' }
          $versao = $linha.Matches[0].Groups[1].Value
          $tag = "v$versao"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "A tag não corresponde à versão $versao"
          }
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "A versão $tag já foi publicada."
            exit 0
          }
          gh release create $tag --target $env:GITHUB_SHA --title "Avaliador de Vazões HTML $tag" --notes 'Pacote portátil para Windows x64. Extraia todo o ZIP e execute GERAR_RELATORIO_HTML.bat.' dist/AVALIADOR_VAZOES_HTML_WINDOWS_X64.zip dist/AVALIADOR_VAZOES_HTML_WINDOWS_X64.sha256
          exit $LASTEXITCODE
